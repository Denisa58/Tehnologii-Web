<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galerie Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-4">
    <h1 class="mb-4">Galerie Bootstrap 5</h1>

    <div class="row g-3">

      <div class="col-12 col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">Card 1</h2>
            <p class="card-text">Descriere scurtă pentru primul card.</p>
            <a href="#" class="btn btn-primary" aria-label="Vezi detalii pentru Card 1">Detalii</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">Card 2</h2>
            <p class="card-text">Descriere scurtă pentru al doilea card.</p>
            <a href="#" class="btn btn-primary" aria-label="Vezi detalii pentru Card 2">Detalii</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">Card 3</h2>
            <p class="card-text">Descriere scurtă pentru al treilea card.</p>
            <a href="#" class="btn btn-primary" aria-label="Vezi detalii pentru Card 3">Detalii</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">Card 4</h2>
            <p class="card-text">Descriere scurtă pentru al patrulea card.</p>
            <button type="button" class="btn btn-outline-secondary" aria-label="Salvează Card 4 la favorite">Salvează</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
