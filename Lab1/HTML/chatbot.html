<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <link rel="stylesheet" href="../CSS/chatbot_style.css">
</head>

<body>
  <div class="chat-app">
    <div class="chat-header">
      <div class="bot-avatar">🤖</div>
      <div class="header-text">
        <h1>ChatBot TW</h1>
        <span>● Online</span>
      </div>
      <a href="home.html" class="back-link">← Home</a>
    </div>

    <div class="chat-container" id="chat-container"></div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Scrie răspunsul tău (a, b sau c)..." autocomplete="off">
      <button type="submit">Trimite</button>
    </form>
  </div>

  <script src="../JS/chatbot_js.js"></script>
</body>

</html>
