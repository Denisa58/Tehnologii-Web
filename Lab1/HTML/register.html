<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Înregistrare</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Înregistrează-te</h1>

      <form class="register-form" action="#" method="post" enctype="multipart/form-data">

        <div class="row">
          <label for="username">Nume utilizator</label>
          <input type="text" id="username" name="username" placeholder="ex:ioanaTW" required>
        </div>

        <div class="row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="ex: nume@email.com" required>
        </div>

        <div class="row two-col">
          <div>
            <label for="password">Parolă</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div>
            <label for="confirm_password">Confirmă parola</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
          </div>
        </div>

        <div class="row">
          <label for="dob">Data nașterii</label>
          <input type="date" id="dob" name="dob">
        </div>

        <div class="row">
          <label>Sex</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="female"> Feminin</label>
            <label><input type="radio" name="gender" value="male"> Masculin</label>
            <label><input type="radio" name="gender" value="other"> Altul</label>
          </div>
        </div>

        <div class="row">
          <label for="country">Țara</label>
          <select id="country" name="country">
            <option value="ro">România</option>
            <option value="md">Moldova</option>
            <option value="hu">Ungaria</option>
            <option value="de">Germania</option>
            <option value="other">Altă țară</option>
          </select>
        </div>

        <div class="row">
          <label>Interese</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" name="interests" value="frontend"> Frontend</label>
            <label><input type="checkbox" name="interests" value="backend"> Backend</label>
            <label><input type="checkbox" name="interests" value="uxui"> UX/UI</label>
            <label><input type="checkbox" name="interests" value="javascript"> JavaScript</label>
            <label><input type="checkbox" name="interests" value="python"> Python Web</label>
            <label><input type="checkbox" name="interests" value="wordpress"> WordPress</label>
            <label><input type="checkbox" name="interests" value="django"> Django</label>
          </div>
        </div>

        <div class="row">
          <label for="avatar">Poză de profil</label>
          <input type="file" id="avatar" name="avatar" accept="image/*">
        </div>

        <div class="row">
          <label for="bio">Scurtă descriere</label>
          <textarea id="bio" name="bio" rows="3" placeholder="Spune-ne câteva cuvinte despre tine..."></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary">Înregistrează-te</button>
          <button type="reset" class="btn ghost">Resetează</button>
        </div>

        <p class="login-link">Ai deja cont?
          <a href="login.html">Mergi la login</a>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
